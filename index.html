/* =========================================================
   删除 / 备份 / 导入
   ========================================================= */
function deleteItem(type, id){
  const it = state.data[type].find(i => i.id === id);
  if(!it) return;

  confirmDialog({
    title:'删除这一条？',
    message:'「' + (it.title || '未命名') + '」将从本机数据中移除，无法恢复。',
    icon:'🗑️',
    okText:'删除',
    onConfirm(){
      const backup = state.data[type];
      state.data[type] = backup.filter(i => i.id !== id);
      if(persist()){
        render();
        toast('已删除');
      }else{
        state.data[type] = backup;
      }
    }
  });
}

function buildExportPayload(){
  return {
    app: 'cp-time-capsule',
    version: 1,
    exportedAt: new Date().toISOString(),
    data: state.data
  };
}

function downloadJsonFile(filename, payload){
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}

function exportBackup(){
  try{
    downloadJsonFile('小歆璐璐备份-' + stamp() + '.json', buildExportPayload());
    toast('备份已开始下载');
  }catch(e){
    toast('导出失败：' + (e.message || '未知错误'), 'error');
  }
}

function exportDataJson(){
  try{
    downloadJsonFile('data.json', buildExportPayload());
    toast('data.json 已下载，替换 GitHub 站点目录里的旧文件并提交即可');
  }catch(e){
    toast('导出失败：' + (e.message || '未知错误'), 'error');
  }
}

function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{
      parsed = JSON.parse(String(reader.result));
    }catch(e){
      toast('导入失败：不是有效的 JSON 文件', 'error');
      return;
    }

    const incoming = parsed && parsed.data ? parsed.data : parsed;
    const keys = ALL_TYPES;
    const valid = incoming && typeof incoming === 'object' && keys.some(k => Array.isArray(incoming[k]));
    if(!valid){
      toast('导入失败：文件格式不正确', 'error');
      return;
    }

    const next = normalize(incoming);
    const total = keys.reduce((n,k)=> n + next[k].length, 0);

    confirmDialog({
      title:'导入备份？',
      message:'将用这份备份替换当前所有内容（备份共 ' + total + ' 条）。当前内容不会保留，建议先导出备份。',
      icon:'📥',
      okText:'导入并替换',
      onConfirm(){
        const prev = state.data;
        state.data = next;
        if(persist()){
          state.page = 'timeline';
          state.year = null;
          state.search = '';
          render();
          toast('导入成功');
        }else{
          state.data = prev;
        }
      }
    });
  };
  reader.onerror = ()=> toast('文件读取失败', 'error');
  reader.readAsText(file, 'utf-8');
}

/* =========================================================
   图片压缩
   ========================================================= */
function dataUrlSize(url){
  const i = String(url).indexOf(',');
  if(i < 0) return 0;
  return Math.floor((url.length - i - 1) * 3 / 4);
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = ()=> reject(new Error('读取图片失败'));
    r.readAsDataURL(file);
  });
}

function loadImage(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=> resolve(img);
    img.onerror = ()=> reject(new Error('图片解码失败，请换用 JPG / PNG 格式'));
    img.src = src;
  });
}

async function compressImageFile(file){
  const isImage = /^image\//.test(file.type) || /\.(png|jpe?g|webp|gif|bmp)$/i.test(file.name || '');
  if(!isImage) throw new Error('请选择图片文件');
  if(file.size > 15 * 1024 * 1024) throw new Error('图片太大（超过 15MB）');

  const raw = await readFileAsDataURL(file);
  const img = await loadImage(raw);

  const maxDim = 1400;
  let w = img.naturalWidth || img.width;
  let h = img.naturalHeight || img.height;
  if(!w || !h) throw new Error('图片尺寸异常');

  const scale = Math.min(1, maxDim / Math.max(w, h));
  w = Math.max(1, Math.round(w * scale));
  h = Math.max(1, Math.round(h * scale));

  const probe = document.createElement('canvas');
  let supportsWebp = false;
  try { supportsWebp = probe.toDataURL('image/webp').indexOf('data:image/webp') === 0; } catch(e){}

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  if(!ctx) throw new Error('浏览器不支持图片处理');

  if(!supportsWebp){
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
  }
  ctx.drawImage(img, 0, 0, w, h);

  const mime = supportsWebp ? 'image/webp' : 'image/jpeg';
  let quality = 0.86;
  let out = canvas.toDataURL(mime, quality);

  while(dataUrlSize(out) > 700 * 1024 && quality > 0.5){
    quality -= 0.08;
    out = canvas.toDataURL(mime, quality);
  }

  if(dataUrlSize(out) > 800 * 1024){
    const c2 = document.createElement('canvas');
    c2.width = Math.max(1, Math.round(w * 0.75));
    c2.height = Math.max(1, Math.round(h * 0.75));
    const ctx2 = c2.getContext('2d');
    if(!ctx2) throw new Error('浏览器不支持图片处理');
    if(!supportsWebp){
      ctx2.fillStyle = '#ffffff';
      ctx2.fillRect(0, 0, c2.width, c2.height);
    }
    ctx2.drawImage(canvas, 0, 0, c2.width, c2.height);
    out = c2.toDataURL(mime, 0.72);
  }

  if(dataUrlSize(out) > 1200 * 1024){
    throw new Error('压缩后图片仍然过大，请换一张或改用图片链接');
  }
  return out;
}

/* =========================================================
   杂项
   ========================================================= */
function firstTabForYear(year){
  for(const k of COLLECTION_TYPES){
    if(state.data[k].some(it => getYear(it) === year)) return k;
  }
  return 'stages';
}

function clearSearch(){
  state.search = '';
  const input = document.getElementById('searchInput');
  if(input) input.value = '';
  const area = document.getElementById('resultsArea');
  if(area && COLLECTION_TYPES.includes(state.page)){
    area.innerHTML = renderGlobalResults(state.page);
  }
}

/* =========================================================
   全局事件委托
   ========================================================= */
let logoTapCount = 0;
let logoTapTimer = null;

document.addEventListener('click', e => {
  /* 点击 logo 三下进入管理者模式 */
  if(e.target.closest('.logo')){
    if(state.isAdmin) return;
    logoTapCount++;
    clearTimeout(logoTapTimer);
    if(logoTapCount >= 3){
      logoTapCount = 0;
      openLogin();
    }else{
      logoTapTimer = setTimeout(()=>{ logoTapCount = 0; }, 800);
    }
    return;
  }

  /* 导航 */
  const navBtn = e.target.closest('[data-nav]');
  if(navBtn){
    state.page = navBtn.dataset.nav;
    state.year = null;
    state.search = '';
    window.scrollTo({top:0, behavior:'smooth'});
    render();
    return;
  }

  /* 管理者模式开关 */
  if(e.target.closest('#adminBtn')){ toggleAdmin(); return; }

  /* 背景音乐 */
  if(e.target.closest('[data-edit-bgm]')){
    if(!state.isAdmin) return;
    openBgmEditor();
    return;
  }

  /* 简介 / 应援群 */
  if(e.target.closest('[data-edit-profile]')){
    if(!state.isAdmin) return;
    openProfileEditor();
    return;
  }

  /* 复制群号 */
  const copyEl = e.target.closest('[data-copy]');
  if(copyEl){
    copyText(copyEl.dataset.copy, '群号已复制', '复制失败，请手动选择群号');
    return;
  }

  /* 导出发布数据 */
  if(e.target.closest('[data-export-publish]')){
    if(!state.isAdmin) return;
    exportDataJson();
    return;
  }

  /* 备份 */
  if(e.target.closest('[data-export]')){ exportBackup(); return; }
  if(e.target.closest('[data-import]')){ document.getElementById('importFile').click(); return; }

  /* 添加 */
  const addBtn = e.target.closest('[data-add]');
  if(addBtn){
    if(!state.isAdmin) return;
    const preset = {};
    const y = addBtn.dataset.year;
    if(y && /^\d{4}$/.test(y)) preset.date = y + '-01-01';
    openEditor(addBtn.dataset.add, null, preset);
    return;
  }

  /* 批量添加 */
  const batchBtn = e.target.closest('[data-batch]');
  if(batchBtn){
    if(!state.isAdmin) return;
    openBulkEditor(batchBtn.dataset.batch, batchBtn.dataset.year || '');
    return;
  }

  /* 编辑 */
  const editBtn = e.target.closest('[data-edit]');
  if(editBtn){
    if(!state.isAdmin) return;
    openEditor(editBtn.dataset.edit, editBtn.dataset.id);
    return;
  }

  /* 删除 */
  const delBtn = e.target.closest('[data-del]');
  if(delBtn){
    if(!state.isAdmin) return;
    deleteItem(delBtn.dataset.del, delBtn.dataset.id);
    return;
  }

  /* 年份内标签切换 */
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ state.yearTab = tabBtn.dataset.tab; render(); return; }

  /* 返回时间线 */
  if(e.target.closest('[data-back]')){
    state.page = 'timeline';
    state.year = null;
    state.search = '';
    render();
    return;
  }

  /* 进入某一年 */
  const yearBtn = e.target.closest('[data-year]');
  if(yearBtn){
    const y = yearBtn.dataset.year;
    state.year = y;
    state.yearTab = firstTabForYear(y);
    state.page = 'year';
    state.search = '';
    window.scrollTo({top:0, behavior:'smooth'});
    render();
    return;
  }

  /* 阅读信件 */
  const letterBtn = e.target.closest('[data-letter]');
  if(letterBtn){
    openLetterModal(letterBtn.dataset.letter, letterBtn.dataset.id);
    return;
  }

  /* 清除搜索 */
  if(e.target.closest('[data-clear-search]')){ clearSearch(); return; }

  /* 点击封面打开视频链接 */
  const openEl = e.target.closest('[data-open]');
  if(openEl){
    const url = safeUrl(openEl.dataset.open);
    if(url) window.open(url, '_blank', 'noopener');
    return;
  }

  /* 点击封面查看大图 */
  const zoomEl = e.target.closest('[data-zoom]');
  if(zoomEl){
    const type = zoomEl.dataset.zoom;
    const id = zoomEl.dataset.id;
    const it = (state.data[type] || []).find(i => i.id === id);
    const src = it ? safeUrl(it.cover, true) : '';
    if(src) openLightbox(src, it.title || '');
    return;
  }

  /* 点击应援群二维码查看大图 */
  if(e.target.closest('[data-zoom-profile]')){
    const src = safeUrl(state.data.profile && state.data.profile.groupQr, true);
    if(src) openLightbox(src, '应援会群二维码');
    return;
  }

  /* 弹窗关闭 */
  if(e.target.classList.contains('modal-mask') || e.target.closest('[data-cancel]')){
    closeModal();
    return;
  }
});

/* 搜索（只重绘结果区，不打断输入） */
document.addEventListener('input', e => {
  if(e.target.id === 'searchInput'){
    state.search = e.target.value;
    const area = document.getElementById('resultsArea');
    if(area && COLLECTION_TYPES.includes(state.page)){
      area.innerHTML = renderGlobalResults(state.page);
    }
  }
});

/* 导入文件 */
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(file) handleImportFile(file);
});

/* Esc 关闭弹窗 */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});

/* 回到顶部 */
const toTopBtn = document.getElementById('toTop');
let scrollTicking = false;
window.addEventListener('scroll', ()=>{
  if(scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(()=>{
    toTopBtn.hidden = window.scrollY < 500;
    scrollTicking = false;
  });
}, {passive:true});
toTopBtn.addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));

/* =========================================================
   启动
   ========================================================= */
initBgm();
showAnnouncement();
(async ()=>{
  try{
    state.data = await loadData();
  }catch(e){
    console.warn('启动加载失败，使用默认数据', e);
    state.data = defaultData();
  }
  render();
})();
</script>
